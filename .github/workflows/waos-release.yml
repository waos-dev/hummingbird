# A release of Hummingbird for WaOS is one tag, `waos-v<version>`, the version of the `hummingbird`
# package: the program packaged by `waos package`, signed with the WaOS project's key, and attached
# with the `index.json` that lists it to the tag's GitHub release, so github.com/waos-dev/hummingbird
# is a WaOS package source (WaOS reads a repository's latest release). Run by hand, it releases a
# tag that exists again; GitHub offers that only while this file is on the default branch, so a
# failed release is otherwise re-run from its run's page.
#
# Secrets: WAOS_SIGNING_KEY, the WaOS project's signing key, the PEM text `waos package` reads.
name: WaOS release

on:
  push:
    tags: ['waos-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release, waos-v<version>
        required: true
        type: string

concurrency:
  group: waos-release-${{ inputs.tag || github.ref_name }}

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  release:
    # On Linux, the cheapest runner that builds it: a component is the same whatever machine built it.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      # The GitHub release, made and given the package and its index.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # rust-toolchain.toml's: WaOS's nightly, with wasm32-wasip3.
      - name: Rust
        run: |
          rustup toolchain install
          rustc --version

      - name: The tag names the program's version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "hummingbird") | .version')
          test "${TAG#waos-v}" = "$version" || { echo "tag $TAG, hummingbird $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # wasi-sdk 34: its cooperative-threads libc, which gives the program its threads, and its
      # clang, for SQLite. waos/env.sh sets both up, as for a local build.
      - name: wasi-sdk 34
        env:
          ARCHIVE: wasi-sdk-34.0-x86_64-linux.tar.gz
          SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/$ARCHIVE"
          echo "$SHA256  $ARCHIVE" | sha256sum -c -
          tar -xzf "$ARCHIVE"
          rm "$ARCHIVE"
          cd "$GITHUB_WORKSPACE"
          WASI_SDK="$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux" . waos/env.sh
          env | grep -E '^(CC|CXX|AR|CFLAGS|CXXFLAGS)_wasm32_wasip3=|^CARGO_TARGET_WASM32_WASIP3_RUSTFLAGS=' >> "$GITHUB_ENV"

      # The `waos` of the WaOS revision the SDK is taken at, read from the lockfile so the two never
      # differ.
      - name: waos
        run: |
          rev=$(cargo metadata --locked --format-version 1 | jq -r '.packages[] | select(.name == "wasdk") | .source | capture("#(?<rev>[0-9a-f]{40})$").rev')
          test -n "$rev" || { echo "no wasdk revision in the lockfile"; exit 1; }
          cargo install --git https://github.com/waos-dev/waos --rev "$rev" waos-cli --locked
          waos --version

      # Without the online services, whose reqwest has no WASI backend.
      - name: Hummingbird, packaged
        env:
          WAOS_SIGNING_KEY: ${{ secrets.WAOS_SIGNING_KEY }}
        run: |
          waos package --no-default-features
          waos package verify "target/waos/dev.waos.hummingbird-$VERSION.wapk"

      - name: The package and its index, on the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --latest --title "Hummingbird for WaOS $VERSION" --notes "Hummingbird for WaOS $VERSION, \`dev.waos.hummingbird\`. Add \`github.com/waos-dev/hummingbird\` as a source in WaOS to install it."
          gh release upload "$TAG" "target/waos/dev.waos.hummingbird-$VERSION.wapk" target/waos/index.json --clobber
