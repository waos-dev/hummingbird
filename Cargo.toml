[package]
name = "hummingbird"
version = "0.4.0"
edition = "2024"
description = "Music Player"
license = "Apache-2.0"
readme = "README.md"
categories = ["multimedia::audio"]

[features]
console = ["dep:console-subscriber", "tokio/tracing"]
# uses the system allocator to allow allocation observation
heap-profileable = []
update = ["dep:semver", "dep:minisign-verify", "dep:winreg", "online"]
online = ["dep:zed-reqwest"]
libre-services = ["online"]
proprietary-services = ["online"]
default = ["libre-services", "proprietary-services"]
runtime-shaders = ["gpui_platform/runtime_shaders"]

[dependencies]
anyhow = "1"
audioadapter-buffers = "5"
async-compression = { version = "0.4", features = ["zlib", "tokio"] }
async-trait = "0.1"
bitflags = "2"
camino = { version = "1", features = ["serde1"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
cntp_i18n = { version = "0.4", features = ["gpui"] }
console-subscriber = { version = "0.5", optional = true }
dateparser = "0.3"
derive_more = { version = "2", features = ["debug"] }
directories = "6"
file-rotate = "0.8.0"
futures = "0.3"
globwalk = "0.9"
# WaOS port: GPUI from WaOS's fork of Zed, the revision wasdk-adapter-gpui is built on.
gpui = { git = "https://github.com/waos-dev/zed", rev = "ab35bace16f23ddc65bbc8968d69d1d48e0369ad" }
image = "0.25"
icu_collator = "2.1"
indexmap = { version = "2", features = ["serde"] }
intx = "0.1"
itertools = "0.15"
lofty = "0.25"
md5 = "0.8"
minisign-verify = { version = "0.3", optional = true }
notify = "8"
notify-debouncer-full = "0.7.0"
nucleo = "0.5"
postcard = { version = "1", features = ["use-std"] }
rand = "0.10"
raw-window-handle = "0.6"
realfft = "3"
regex = "1"
rtrb = "0.4"
rubato = "5"
rust-embed = "8"
rustc-hash = "2"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", optional = true }
smallvec = "1"
# WaOS port: `sqlite` less `sqlite-load-extension`, which WaOS's SQLite builds without and
# Hummingbird does not use.
sqlx = { version = "0.9", features = ["chrono", "runtime-tokio", "sqlite-bundled", "sqlite-deserialize", "sqlite-unlock-notify"] }
symphonia = { version = "0.6", features = ["all", "opt-simd"] }
sysinfo = "0.40"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
url = "2.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zed-reqwest = { version = "0.12.15-zed", default-features = false, optional = true, features = [
    "json",
    "macos-system-configuration",
    # this was native-roots, but this caused intermittent issues on Windows
    "rustls-tls-webpki-roots",
] }

# WaOS port: what a WaOS program has no backend for, or builds no C for yet.
[target.'cfg(not(target_os = "wasi"))'.dependencies]
discord-rich-presence = "1"
open = "5"
cpal = { version = "0.18.2", features = ["pipewire"] }
mimalloc = { version = "0.1", features = ["no_thp"] }
symphonia-adapter-libopus = "0.3"
symphonia-adapter-fdk-aac = "0.2"
gpui_platform = { git = "https://github.com/waos-dev/zed", rev = "ab35bace16f23ddc65bbc8968d69d1d48e0369ad", features = ["wayland", "x11", "font-kit"] }

# WaOS port: the SDK a WaOS program is written with, and GPUI's platform over it.
[target.'cfg(target_os = "wasi")'.dependencies]
wasdk = { git = "https://github.com/waos-dev/waos", tag = "v0.7.0" }
wasdk-adapter-gpui = { git = "https://github.com/waos-dev/waos", tag = "v0.7.0" }

[build-dependencies]
anyhow = "1"
cntp_i18n_gen = "0.4"
dotenvy = "0.15"
vergen = { version = "10", features = ["build"] }

[dev-dependencies]
gpui = { git = "https://github.com/waos-dev/zed", rev = "ab35bace16f23ddc65bbc8968d69d1d48e0369ad", features = ["test-support"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Devices_Enumeration",
    "Foundation_Collections",
    "Media",
    "Media_Audio",
    "Media_MediaProperties",
    "Media_Render",
    "Storage_Search",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_WinRT",
    "Win32_System_Power",
    "Win32_System_Recovery",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging"
] }
winreg = { version = "0.56", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
core-text = "=21.0.0" # GPUI issue, zed#47168
block2 = "0.6"
imagesize = "0.15"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSImage"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-foundation = { version = "0.3", features = [
    "NSData",
    "NSDictionary",
    "NSProcessInfo",
    "NSValue",
] }
objc2-media-player = { version = "0.3", features = ["MPNowPlayingInfoCenter"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
mpris-server = "0.11"
zbus = "6"

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev-optimized]
inherits = "release"
debug = "full"
strip = "none"
lto = "none"
opt-level = "s"

[profile.release]
opt-level = "s"
lto = "thin"
strip = "symbols"

[profile.release-distro]
inherits = "release"
codegen-units = 1
lto = "fat"
debug = "full"
split-debuginfo = "packed"

# WaOS port: cntp_i18n's GPUI conversions over the fork's GPUI.
[patch.crates-io]
cntp_i18n_core = { path = "waos/patched/cntp_i18n_core" }
# WaOS port: tokio's timed park waits on its condvar on wasm32-wasip3, whose cooperative threads
# it took for no threads at all, sleeping out the timeout with its lock held.
tokio = { path = "waos/patched/tokio" }
# WaOS port: getrandom 0.3 on wasm32-wasip3, through getrandom 0.4 (the Zed port's copy).
getrandom = { path = "waos/patched/getrandom-0.3" }

# WaOS port: the id `waos run` runs this program as, and its name in WaOS.
[package.metadata.waos]
id = "dev.waos.hummingbird"
name = "Hummingbird"
# Hummingbird's macOS icon, square and filling its canvas, as WaOS draws icons (waos/icon.svg).
icon = "waos/icon.png"
